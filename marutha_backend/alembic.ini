# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = alembic/versions
path_separator = os

# Use your REAL Postgres URL here
sqlalchemy.url = postgresql+psycopg2://postgres:AcademyRootPassword@localhost:5432/marutha_support



[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
